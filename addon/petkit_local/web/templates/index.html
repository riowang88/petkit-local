<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetKit Local</title>
<link rel="stylesheet" href="static/styles.css?v={{ asset_version }}">
</head>
<body>
<header>
  <h1>🐾 <span class="full">PetKit Local</span></h1>
  <nav role="tablist" aria-label="面板栏目">
    <button data-tab="devices" role="tab" aria-selected="true" aria-controls="tab-devices" class="on">设备</button>
    <button data-tab="timeline" role="tab" aria-selected="false" aria-controls="tab-timeline">时间线</button>
    <button data-tab="pets" role="tab" aria-selected="false" aria-controls="tab-pets">AI / 宠物</button>
    <button data-tab="provision" role="tab" aria-selected="false" aria-controls="tab-provision">蓝牙配网</button>
    <button data-tab="log" role="tab" aria-selected="false" aria-controls="tab-log">日志</button>
    <button data-tab="capture" role="tab" aria-selected="false" aria-controls="tab-capture">流量记录</button>
    <button data-tab="patchers" role="tab" aria-selected="false" aria-controls="tab-patchers">设备补丁</button>
    <button data-tab="setup" role="tab" aria-selected="false" aria-controls="tab-setup">设置</button>
  </nav>
  <span class="grow"></span>
  <span id="wsState" class="pill">…</span>
</header>
<main>
  <section id="tab-devices" role="tabpanel">
    <div id="devPanels"><div class="empty mut">加载中…</div></div>
  </section>
  <section id="tab-timeline" role="tabpanel" class="hidden"><div id="timelineView">…</div></section>
  <section id="tab-pets" role="tabpanel" class="hidden"><div id="petsView">…</div></section>
  <section id="tab-log" role="tabpanel" class="hidden">
    <div class="card">
      <div class="row head">
        <h3>实时通信日志</h3>
        <label class="mut"><input type="checkbox" id="hideHb" checked> 隐藏心跳</label>
        <label class="mut"><input type="checkbox" id="autoscroll" checked> 自动滚动</label>
        <span class="grow"></span>
        <span id="logCount" class="mut"></span>
        <button class="act" data-action="download-log">下载</button>
        <button class="act danger" data-action="clear-log">清除</button>
      </div>
      <div id="logView" class="log pane"></div>
    </div>
    <div class="card devlog">
      <div class="row head">
        <h3>设备日志</h3>
        <select id="devLogPick" data-change="devlog-pick"></select>
        <input id="devLogGrep" placeholder="搜索日志…" data-input="devlog-grep" autocomplete="off" spellcheck="false">
        <span class="grow"></span>
        <span id="devLogCount" class="mut"></span>
        <a id="devLogDl" class="act" style="display:none">下载</a>
      </div>
      <p class="sub">设备上传到此处的 <code>devRun.log</code>。需在设备上启用<b>收集调试日志</b>，具体上传时间由设备决定。</p>
      <div id="devLogView" class="log pane"></div>
    </div>
  </section>
  <section id="tab-provision" role="tabpanel" class="hidden">
    <div id="provWarn" class="card notice" style="display:none"></div>
    <div id="provForm" class="card">
      <h3>通过蓝牙配置设备</h3>
      <p class="sub">将 PetKit 设备设为配网状态，填写 Wi-Fi 信息后开始配网。设备将连接 Wi-Fi 并访问此服务。</p>
      <div class="row">
        <div class="col"><label class="mut">Wi-Fi 名称<button class="help" type="button" data-action="help" data-help="设备将连接的网络，未必与浏览器当前网络相同。信息通过蓝牙发送到设备。">?</button></label><input id="p-ssid" autocomplete="off"></div>
        <div class="col"><label class="mut">Wi-Fi 密码<button class="help" type="button" data-action="help" data-help="必须填写密码；此方式不支持开放网络。密码通过蓝牙从此页面发送到设备，不发送给本地服务或 PETKIT。">?</button></label><input id="p-pass" type="password" autocomplete="off"></div>
      </div>
      <label class="mut field-label">设备服务器地址<button class="help" type="button" data-action="help" data-help="设备将访问此地址而非 PETKIT 云端。配网时会写入设备；请使用设备能解析的 IP 或名称，多数设备无法解析 .local 名称。">?</button></label><input id="p-server">
      <label class="mut field-label">时区<button class="help" type="button" data-action="help" data-help="设备使用此处提供的固定 UTC 偏移，不会自动调整夏令时；不设置时视频可能显示 UTC。标有“已检测”的选项是浏览器当前偏移。">?</button></label>
      <select id="p-tz"></select>
      <div class="form-actions"><button id="p-btn" class="act" data-action="provision">通过蓝牙配网</button>
        <span id="p-status" class="mut"></span></div>
      <pre id="p-log" style="display:none"></pre>
    </div>
  </section>
  <section id="tab-capture" role="tabpanel" class="hidden"><div id="capView" class="card">…</div></section>
  <section id="tab-patchers" role="tabpanel" class="hidden"><div id="patchView">…</div></section>
  <section id="tab-setup" role="tabpanel" class="hidden"><div id="setupView">…</div></section>
</main>
<div id="toast" class="toast"></div>
<div id="mediaModal" class="modal hidden" data-action="modal-backdrop">
  <div class="modal-box"><button class="ghost act modal-close" data-action="close-modal">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
{% include "_cropper.html" %}
<!-- Which build this DOCUMENT is, as opposed to which one the server is running.
     The two are answered from different places on purpose: this one arrived
     with the page and may have come out of a cache, while /api/info answers
     live. `js/main.js` compares them.

     This one is a CLASSIC script and must stay above the module below it: a
     module is deferred, so it runs after the document is parsed, and it reads
     this global on the way past. -->
<script>window.PANEL_ASSET_V = "{{ asset_version }}";</script>
<script type="module" src="asset/{{ asset_version }}/js/main.js"></script>
</body></html>
