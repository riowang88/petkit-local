name: publish

# This fork is deployed as a plain container (docker-compose.yml at the root),
# not through the Home Assistant Supervisor, so it publishes to Docker Hub with
# the same two repository secrets the other projects here use:
#
#   DOCKERHUB_USERNAME   the Docker Hub account
#   DOCKERHUB_TOKEN      an access token with Read & Write on that account
#
# Tags:
#   push to main  -> `latest` and the full commit SHA
#   `v*` git tag  -> the version (which must match config.yaml), plus `latest`
#                    and the commit SHA
# The SHA tag is what you pin a NAS to when `latest` must not move under it.
#
# Images are built only after the test suite passes (tests.yml is called below
# rather than run beside this), so a red commit never becomes `latest`.
#
# ONE image, multi-arch. Compose has no `{arch}` substitution, so the three
# architectures build in parallel, are pushed into the same repository BY
# DIGEST (no tag, so the jobs cannot race for one), and a manifest list is
# assembled from them afterwards.
#
# Third-party actions are pinned to a commit SHA, not a tag. `@v6` is a moving
# tag: whoever controls that repository can point it at new code, which then
# runs here with the Docker Hub token in reach. The trailing comment is the
# release each SHA belongs to; to update one, resolve the tag yourself rather
# than trusting the comment:
#
#   gh api repos/docker/build-push-action/commits/v6 --jq .sha

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/rio22/petkit-local

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Emulation for the two ARM targets, and buildx because TARGETARCH is a
      # BuildKit built-in that the legacy builder leaves empty -- the per-arch
      # base selection in the Dockerfile does not work without it.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./addon
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # An empty file named after the digest: the merge job only needs the
      # names, and this is the shape `download-artifact` reassembles cleanly.
      - name: Hand the digest to the merge job
        run: |
          set -eu
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Assemble the manifest and name it
        run: |
          set -eu
          tags="-t ${IMAGE}:latest -t ${IMAGE}:${GITHUB_SHA}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Refuse a tag that disagrees with config.yaml rather than
            # publishing a version name the code does not carry.
            declared=$(sed -n 's/^version: *"\(.*\)"$/\1/p' addon/config.yaml)
            version="${GITHUB_REF_NAME#v}"
            if [ "$declared" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match config.yaml version $declared"
              exit 1
            fi
            tags="$tags -t ${IMAGE}:${version}"
          fi

          sources=""
          for d in /tmp/digests/*; do
            sources="$sources ${IMAGE}@sha256:$(basename "$d")"
          done

          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $sources
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}"

      # The manifest list must name all three platforms, or a NAS on the
      # missing one pulls nothing.
      - name: Verify every platform is in the manifest
        run: |
          set -eu
          platforms=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" --format '{{json .Manifest}}' \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(" ".join(sorted(p["platform"]["os"]+"/"+p["platform"]["architecture"]+("/"+p["platform"]["variant"] if p["platform"]["architecture"]=="arm" and p["platform"].get("variant") else "") for p in m["manifests"] if p["platform"]["os"]!="unknown")))')
          echo "platforms: $platforms"
          for want in linux/amd64 linux/arm64 linux/arm/v7; do
            case " $platforms " in
              *" $want "*) ;;
              *) echo "::error::$want missing from ${IMAGE}:${GITHUB_SHA}"; exit 1 ;;
            esac
          done
